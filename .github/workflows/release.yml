name: Išleisti naują versiją

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Kas naujo (palik tuščią – bus paimta iš KAS_NAUJO.md arba commit'ų)"
        type: string
        required: false
        default: ""
      bump:
        description: "Kurią versijos dalį didinti"
        type: choice
        options: [patch, minor, major]
        default: patch
      bridge_exe:
        description: "Pridėti ir vieno failo PrintReady.exe (kad senos versijos galėtų atsinaujinti)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Atsisiųsti kodą
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Įdiegti bibliotekas
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Nustatyti versiją ir pakeitimų aprašą
        id: prep
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: python .github/scripts/release_prep.py --bump "${{ inputs.bump }}" --notes-out "$env:RUNNER_TEMP/release_notes.md"

      - name: Sukompiliuoti programą
        run: python build.py

      - name: Sudaryti ir patikrinti ZIP
        run: python package_release.py

      - name: Sukompiliuoti vieno failo exe senoms versijoms
        if: ${{ inputs.bridge_exe }}
        run: python build.py --onefile

      - name: Įrašyti versiją ir sukurti tag'ą
        env:
          TAG: ${{ steps.prep.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater.py KAS_NAUJO.md
          git commit -m "Versija $env:TAG"
          git tag -a $env:TAG -m "Versija $env:TAG"
          git push --atomic origin HEAD:main "refs/tags/$env:TAG"

      - name: Sukurti GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.tag }}
          VERSION: ${{ steps.prep.outputs.version }}
          BRIDGE: ${{ inputs.bridge_exe }}
        run: |
          $files = @("dist/PrintReady_v$env:VERSION.zip")
          if ($env:BRIDGE -eq 'true') { $files += "dist_tiltas/PrintReady.exe" }
          foreach ($f in $files) { if (-not (Test-Path $f)) { throw "Nerastas failas: $f" } }
          gh release create $env:TAG @files --title "PrintReady v$env:VERSION" --notes-file "$env:RUNNER_TEMP/release_notes.md" --latest --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Nepavyko sukurti release" }
